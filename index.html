  function countAsMode(seed) {
    const r = rng(seed), set = T.makeWhere(r.pick(['siblings', 'pets', 'shoes']), r, r.int(14, 20), v => Stats.modes(v).length === 1 && !Stats.counts(v).some(p => p[0] === Math.max(...Stats.counts(v).map(c => c[1])))), cats = catsOf(set), cnts = Stats.freq(set.values, cats);
    const [md] = Stats.modes(set.values), top = Math.max(...cnts);
    return q('Find the mode.', T.tableOf(set, cats), fmt(md), `${fmt(md)} has the biggest count, ${top}, so it is the most common value.`,
      [[fmt(top), named('The count as the mode', `${top} is how many times the mode happened. The mode is the value itself: ${fmt(md)}.`)],
        [fmt(cats[cnts.indexOf(Math.min(...cnts.filter(c => c > 0)))]), named('The least common value', 'The mode is the value with the biggest count.')]], set);
  }
  // ---------- Level 4: Showing Categories ----------
  function linesFrom(set, r) {
    const cats = catsOf(set), cnts = Stats.freq(set.values, cats), ch = Object.assign(Displays.chartOf(set, 'bar', 2), {});
    const i = cats.map((c, j) => j).filter(j => cnts[j] >= 4 && cnts[j] % 2 === 0)[0];
    if (i === undefined) return null;
    const c = cats[i], k = cnts[i];
    return q(`How many are <strong>${fmt(c)}</strong>? (The scale counts by 2s.)`, { chart: ch, what: whatOf(set), key: set.key, o: set.o }, String(k), `The ${fmt(c)} bar reaches the line labeled ${k}.`,
      [[String(k / 2), named('Counting lines, not reading the scale', `The bar’s top is ${k / 2} lines up, but each line is worth 2. Read the number on the scale: ${k}.`)],
        [String(k + 1), named('Reading past the bar', 'Read straight across from the top of the bar to the scale.')]], set);
  }
  function linesQ(seed) {
    const r = rng(seed);
    for (let t = 0; t < 50; t++) { const key = r.pick(['eyes', 'subject', 'marbles']); const s = make(key, T.seedOf(r), r.int(20, 30)); const x = linesFrom(s, r); if (x) return x; }
    throw new Error('no bar to read');
  }
  function partToPart(seed) {
    const r = rng(seed), set = make(r.pick(['eyes', 'subject', 'marbles']), T.seedOf(r), r.int(12, 20)), cats = catsOf(set), cnts = Stats.freq(set.values, cats), n = set.values.length;
    const i = cnts.findIndex(c => c > 0 && c < n), c = cats[i], k = cnts[i];
    return q(`What fraction of the whole is <strong>${fmt(c)}</strong>?`, T.tableOf(set, cats), `${k}/${n}`, `${k} of the ${n} values are ${fmt(c)}: ${k}/${n} of the whole (its share of a pie chart).`,
      [[`${k}/${n - k}`, named('Part to part, not part to whole', `${k}/${n - k} compares ${fmt(c)} with the rest. The whole is all ${n} values, so the fraction is out of ${n}.`)],
        [`${n - k}/${n}`, named('The rest, not the part', `${n - k}/${n} is everything that is not ${fmt(c)}.`)]], set);
  }
  // ---------- Level 5: Showing Numbers ----------
  function edgeValue(seed) {
    const r = rng(seed), w = r.pick([5, 10]), a = r.int(5, 9) * w, x = a + w, bins = [0, 1, 2].map(j => [a - w + j * w, a - w + j * w + w - 1]);
    const label = b => `${b[0]}–${b[1]}`;
    return q(`A histogram has bins ${bins.map(label).join(', ')}. Which bin does the value ${x} go in?`, null, label(bins[2]), `${x} is the first value of ${label(bins[2])}. The bin before it ends at ${x - 1}.`,
      [[label(bins[1]), named('An edge value in the wrong bin', `${label(bins[1])} ends at ${x - 1}, so ${x} is not in it. A value on an edge starts the next bin.`)],
        ['Both of them', named('Counting a value twice', 'Each value goes in exactly one bin; the bins don’t overlap.')]]);
  }
  function oneLeaf(seed) {
    const r = rng(seed), s = r.int(5, 9), l = sorted([r.int(0, 4), r.int(0, 4), r.int(5, 9), r.int(5, 9)]).filter((x, i, A) => A.indexOf(x) === i);
    const rep = l[0], leaves = sorted([rep, ...l]), vals = leaves.map(x => s * 10 + x);
    return q(`Which is the stem-and-leaf row for ${r.shuffle(vals).map(fmt).join(', ')}?`, null, `${s} | ${leaves.join(' ')}`, `Every value gets its own leaf, so ${s * 10 + rep}, which appears twice, gets two ${rep}s. The leaves are in order.`,
      [[`${s} | ${l.join(' ')}`, named('One leaf for a repeated value', `${s * 10 + rep} appears twice, so it needs two leaves. Otherwise the plot loses a value.`)],
        [`${s} | ${leaves.slice().reverse().join(' ')}`, named('Leaves out of order', 'The leaves are right, but put them in order from least to greatest.'), true]]);
  }
  // ---------- Level 6: Spread ----------
  function rangeAsIqr(seed) {
    const r = rng(seed), set = T.makeWhere(r.pick(['height', 'points', 'scores', 'travel']), r, r.int(8, 12), v => { const q4 = Stats.quartiles(v); return Stats.range(v) !== q4.q3 - q4.q1; }), v = set.values, qq = Stats.quartiles(v), iqr = qq.q3 - qq.q1;
    return q('Find the IQR.', T.dataOf(set), fmt(iqr), `Q1 = ${fmt(qq.q1)} and Q3 = ${fmt(qq.q3)}, so the IQR is ${fmt(qq.q3)} − ${fmt(qq.q1)} = ${fmt(iqr)}: the spread of the middle half.`,
      [[fmt(Stats.range(v)), named('The range instead of the IQR', `${fmt(Stats.range(v))} is the greatest minus the least: the range. The IQR uses only the middle half, Q3 − Q1.`)],
        [fmt(qq.q3), named('Q3 instead of the IQR', `${fmt(qq.q3)} is Q3. Subtract Q1 from it.`)]], set);
  }
  function medianIn(seed) {
    const r = rng(seed), set = T.makeWhere(r.pick(['height', 'points', 'scores']), r, r.pick([7, 9, 11]), v => { const a = Stats.quartiles(v), b = Stats.quartilesWith(v); return a.q3 - a.q1 !== b.q3 - b.q1 && Stats.range(v) !== a.q3 - a.q1; }), v = set.values, a = Stats.quartiles(v), b = Stats.quartilesWith(v);
    return q('Find the IQR. (The count is odd.)', T.dataOf(set), fmt(a.q3 - a.q1), `The median, ${fmt(a.med)}, is left out of both halves. Then Q1 = ${fmt(a.q1)} and Q3 = ${fmt(a.q3)}, so the IQR is ${fmt(a.q3 - a.q1)}.`,
      [[fmt(b.q3 - b.q1), named('Keeping the median in the halves', `That counts the median in both halves. Here, when the count is odd, leave the median out before finding Q1 and Q3.`), true],
        [fmt(Stats.range(v)), named('The range instead of the IQR', 'That is the greatest minus the least. The IQR is Q3 − Q1.')]], set);
  }
  // ---------- Level 7: Change Over Time ----------
  const lineData = set => ({ chart: { type: 'line', labels: Spread.labelsOf(set), values: set.values, axis: Spread.lineAxis(set.values) }, what: whatOf(set), key: set.key, o: set.o });
  function lastDay(seed) {
    const r = rng(seed), set = T.makeWhere('weather', r, 14, v => { const k = Spread.trendOf(v).kind; const d = v[13] - v[12]; return (k === 'up' && d < 0) || (k === 'down' && d > 0); }), k = Spread.trendOf(set.values).kind;
    const W = { up: 'Mostly went up', down: 'Mostly went down' }, other = k === 'up' ? 'down' : 'up';
    return q('Over the whole 14 days, what did the temperature do?', lineData(set), W[k], `Day to day it wiggles, and it even ${other === 'down' ? 'dropped' : 'rose'} on the last day, but over the whole two weeks it ${k === 'up' ? 'climbed' : 'fell'}.`,
      [[W[other], named('Reading the last day, not the trend', `The last day went ${other}, but the trend is the overall direction. Compare the start with the end, and look at the whole line.`)],
        ['Stayed about the same', named('Missing the trend', 'Look past the wiggles: does the whole line climb or fall?')]], set);
  }
  function valueNotChange(seed) {
    const r = rng(seed), set = T.makeWhere('weather', r, r.int(7, 10), v => v[v.length - 1] !== v[0]), v = set.values, L = Spread.labelsOf(set), a = 0, b = v.length - 1, d = Math.abs(v[b] - v[a]);
    return q(`From ${L[a]} to ${L[b]}, how much did the temperature ${v[b] > v[a] ? 'go up' : 'go down'}?`, lineData(set), `${fmt(d)} degrees`, `${L[a]} was ${fmt(v[a])}°F and ${L[b]} was ${fmt(v[b])}°F: the change is the difference, ${fmt(d)} degrees.`,
      [[`${fmt(v[b])} degrees`, named('The value, not the change', `${fmt(v[b])}°F is the temperature on ${L[b]}. The change is the difference between the two days.`)],
        [`${fmt(v[a] + v[b])} degrees`, named('Adding, not subtracting', 'The change is the difference: subtract.')]], set);
  }
  // ---------- Level 8: Shape and the Normal Curve ----------
  function tailPull(seed) {
    const set = Shape.shapeSet(seed, rng(seed)() < 0.5 ? 'right' : 'left', true), k = Shape.shapeOf(set.values), big = k === 'right' ? 'The mean' : 'The median';
    return q('For this data, which is greater: the mean or the median?', { chart: Displays.chartFor(set, 'hist'), what: `${whatOf(set)} (200 values)`, key: set.key, o: set.o }, big,
      `It is skewed ${k}: the long tail of ${k === 'right' ? 'large' : 'small'} values pulls the mean ${k === 'right' ? 'up' : 'down'}, but the median, the middle value, hardly moves.`,
      [[k === 'right' ? 'The median' : 'The mean', named('Forgetting that the tail pulls the mean', `In a set skewed ${k}, the mean is pulled toward the long tail, ${k === 'right' ? 'above' : 'below'} the median.`)],
        ['They are about the same', named('Treating skewed data as symmetric', 'That is true only when there is no long tail.')]], set);
  }
  function sampleN(seed) {
    const r = rng(seed), set = T.makeWhere(r.pick(['shoes', 'siblings', 'pets', 'dice']), r, r.int(4, 6), v => Number.isInteger(mean(v)) && new Set(v).size > 2), v = set.values;
    const s = r1(Stats.sd(v, true)), sg = r1(Stats.sd(v)), vr = r1(Stats.variance(v, true));
    return q('These values are a <strong>sample</strong> from a bigger group. Which is the sample standard deviation, <em>s</em>, to the nearest tenth?', T.dataOf(set), fmt(s), `For a sample, divide the total of the squared distances by n − 1 = ${v.length - 1}, then take the square root: s ≈ ${fmt(s)}.`,
      [[fmt(sg), named('Dividing by n for a sample', `That divides by n = ${v.length}: that is σ, for a whole population. A sample divides by n − 1.`)],
        [fmt(vr), named('Forgetting the square root', 'That is the variance. The standard deviation is its square root.')]], set);
  }
  function bothTails(seed) {
    const m = rng(seed).pick(Shape.MODELS), at = k => fmt(+(m.mu + k * m.sd).toFixed(6));
    return q(`The ${m.what} follow a normal curve with a mean of ${fmt(m.mu)} and a standard deviation of ${fmt(m.sd)}. About what percent are above ${at(1)}?`, null, '16%', `${at(1)} is 1 SD above the mean. 68% are within 1 SD, so 32% are outside, split evenly between the two tails: 16% above.`,
      [['32%', named('Both tails, not one', `32% are outside 1 SD on both sides together. Above ${at(1)} is just one tail: half of it.`)],
        ['84%', named('The wrong side', `84% are below ${at(1)}. The part above it is the small tail.`)],
        ['68%', named('Inside, not above', '68% are within 1 SD of the mean, on both sides.')]]);
  }

  const GROUPS = [
    { n: 1, title: 'Kinds of Data', list: [{ name: 'Numbers Used as Names', make: namesAsNumbers }, { name: 'A Question With One Answer', make: oneAnswer }] },
    { n: 2, title: 'Organize It', list: [{ name: 'Leaving Out a Count of 0', make: zeroRow }, { name: 'Counting a Value Twice', make: twice }] },
    { n: 3, title: 'Center', list: [{ name: 'The Median Without Sorting', make: s => unsortedFrom(T.makeWhere(rng(s).pick(['height', 'points', 'scores']), rng(s + 1), 7 + 2 * (s % 2), v => v[(v.length - 1) / 2] !== median(v) && new Set(v).size === v.length && r1(mean(v)) !== median(v) && r1(mean(v)) !== v[(v.length - 1) / 2])) },
      { name: 'The Total as the Mean', make: totalAsMean }, { name: 'The Count as the Mode', make: countAsMode }] },
    { n: 4, title: 'Showing Categories', list: [{ name: 'Counting Lines, Not the Scale', make: linesQ }, { name: 'Part to Part, Not Part to Whole', make: partToPart }] },
    { n: 5, title: 'Showing Numbers', list: [{ name: 'An Edge Value in the Wrong Bin', make: edgeValue }, { name: 'One Leaf for a Repeated Value', make: oneLeaf }] },
    { n: 6, title: 'Spread', list: [{ name: 'The Range Instead of the IQR', make: rangeAsIqr }, { name: 'Keeping the Median in the Halves', make: medianIn }] },
    { n: 7, title: 'Change Over Time', list: [{ name: 'Reading the Last Day, Not the Trend', make: lastDay }, { name: 'The Value, Not the Change', make: valueNotChange }] },
    { n: 8, title: 'Shape and the Normal Curve', list: [{ name: 'Forgetting That the Tail Pulls the Mean', make: tailPull }, { name: 'Dividing by n for a Sample', make: sampleN }, { name: 'Both Tails, Not One', make: bothTails }] },
  ];
  return { GROUPS };
})();
</script>
<script>/* Data Coach: bar graphs and pie charts, drawn as SVG. Each can be drawn by the student (drag, or use the
   arrow keys; every value snaps to a whole count or a whole share) or shown finished, as a picture with
   its values in words for screen readers. */
const Charts = (() => {
  'use strict';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const fmt = Stats.fmt;
  // Slice colors: a category that is a color gets its color; others get soft palette shades.
  const SHADES = ['#f3e3c8', '#e3e8d3', '#f3dfd0', '#dfe6ee', '#efe0ec', '#f6ead2', '#e6dccb', '#ece3d3', '#d9e4dc', '#f1d9d2', '#e2dcef', '#f4ecd0'];
  const fill = (c, i) => Pics.COLOR[c] || SHADES[i % SHADES.length];
  // Where the pointer is, in the SVG's own units.
  function svgPoint(svg, e) {
    const b = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    return { x: vb.x + (e.clientX - b.left) * (vb.width / b.width), y: vb.y + (e.clientY - b.top) * (vb.height / b.height) };   // the viewBox may not start at 0 0 (the pie's does not)
  }

  /* ---------- Bar graph ----------
     o: { cats, values (bar heights), step (count scale; null until chosen), top, edit, onChange } */
  const BW = 340, BH = 250, L = 44, Rm = 10, Tm = 14;
  function bar(box, o) {
    // A histogram's bars touch (each is a range of numbers); a bar graph's bars stand apart.
    const k = o.cats.length, plotW = BW - L - Rm, colW = plotW / k, barW = o.hist ? colW : Math.min(36, colW * 0.62);
    const longest = Math.max(...o.cats.map(c => String(fmt(c)).length)), tilt = longest * 6.4 > colW - 2;
    const Bm = tilt ? 58 : 36, plotH = BH - Tm - Bm, top = o.top || 1;
    const y = v => Tm + plotH * (1 - v / top);
    const x = i => L + colW * i + colW / 2;
    let grid = '';
    if (o.step) for (let v = 0; v <= top; v += o.step) grid += `<line x1="${L}" y1="${y(v)}" x2="${BW - Rm}" y2="${y(v)}" class="c-grid"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="c-tick">${v}</text>`;
    const labels = o.cats.map((c, i) => tilt ? `<text transform="translate(${x(i) + 4} ${Tm + plotH + 10}) rotate(-45)" text-anchor="end" class="c-lab">${esc(fmt(c))}</text>` : `<text x="${x(i)}" y="${Tm + plotH + 18}" text-anchor="middle" class="c-lab">${esc(fmt(c))}</text>`).join('');
    const cols = o.cats.map((c, i) => {
      const v = o.values[i], h = plotH * v / top;
      const attrs = o.edit && o.step ? ` tabindex="0" role="slider" aria-label="${esc(fmt(c))} bar" aria-valuemin="0" aria-valuemax="${top}" aria-valuenow="${v}" aria-valuetext="${esc(fmt(c))}: ${v}"` : '';
      return `<g class="c-col${o.edit && o.step ? ' c-edit' : ''}" data-i="${i}"${attrs}>
        <rect class="c-hit" x="${x(i) - colW / 2}" y="${Tm}" width="${colW}" height="${plotH}" fill="transparent"/>
        <rect class="c-bar" x="${x(i) - barW / 2}" y="${y(v)}" width="${barW}" height="${h}" fill="${o.hist ? SHADES[0] : fill(c, i)}"/>
        ${o.edit && o.step ? `<rect class="c-handle" x="${x(i) - barW / 2 + (o.hist ? 3 : -3)}" y="${y(v) - 4}" width="${barW + (o.hist ? -6 : 6)}" height="8" rx="3"/><text class="c-val" x="${x(i)}" y="${y(v) - 8}" text-anchor="middle">${v || ''}</text>` : ''}
      </g>`;
    }).join('');
    const label = o.edit ? '' : ` role="img" aria-label="${o.hist ? 'Histogram' : 'Bar graph'}. ${esc(o.cats.map((c, i) => `${fmt(c)}: ${o.values[i]}`).join(', '))}."`;
    box.innerHTML = `<svg class="chart${o.edit && o.step ? ' c-editing' : ''}" viewBox="0 0 ${BW} ${BH}"${label}>
      ${grid}<line x1="${L}" y1="${Tm}" x2="${L}" y2="${Tm + plotH}" class="c-axis"/><line x1="${L}" y1="${Tm + plotH}" x2="${BW - Rm}" y2="${Tm + plotH}" class="c-axis"/>
      <text transform="translate(12 ${Tm + plotH / 2}) rotate(-90)" text-anchor="middle" class="c-lab">Count</text>${cols}${labels}</svg>`;
    if (!o.edit || !o.step) return;
    const svg = box.querySelector('svg');
    const set = (i, v) => {
      v = Math.max(0, Math.min(top, Math.round(v)));
      if (v === o.values[i]) return;
      o.values[i] = v;
      const g = svg.querySelector(`[data-i="${i}"]`), h = plotH * v / top;
      g.querySelector('.c-bar').setAttribute('y', y(v)); g.querySelector('.c-bar').setAttribute('height', h);
      g.querySelector('.c-handle').setAttribute('y', y(v) - 4);
      const t = g.querySelector('.c-val'); t.setAttribute('y', y(v) - 8); t.textContent = v || '';
      g.setAttribute('aria-valuenow', v); g.setAttribute('aria-valuetext', `${fmt(o.cats[i])}: ${v}`);
      if (o.onChange) o.onChange();
    };
    svg.querySelectorAll('.c-col').forEach(g => {
      const i = +g.dataset.i, toV = e => top * (1 - (svgPoint(svg, e).y - Tm) / plotH);
      // A mouse or pen drags the bar. A finger taps it instead (the bar goes to where the tap lifts), so a swipe over the graph
      // still scrolls the page and never changes a bar.
      let touch = null;
      g.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') { touch = { x: e.clientX, y: e.clientY }; return; }
        e.preventDefault(); g.focus(); set(i, toV(e)); try { g.setPointerCapture(e.pointerId); } catch (err) { /* no capture: the bar still moves on each press */ }
      });
      g.addEventListener('pointerup', e => { if (e.pointerType === 'touch' && touch && Math.hypot(e.clientX - touch.x, e.clientY - touch.y) < 10) { g.focus(); set(i, toV(e)); } touch = null; });
      g.addEventListener('pointercancel', () => { touch = null; });
      g.addEventListener('pointermove', e => { if (g.hasPointerCapture(e.pointerId)) set(i, toV(e)); });
      g.addEventListener('keydown', e => {
        const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: o.step, PageDown: -o.step }[e.key];
        if (d !== undefined) { e.preventDefault(); set(i, o.values[i] + d); } else if (e.key === 'Home') { e.preventDefault(); set(i, 0); } else if (e.key === 'End') { e.preventDefault(); set(i, top); }
      });
    });
  }

  /* ---------- Pie chart ----------
     o: { cats, values (each slice's count), n (equal parts), edit, onChange }. Slices run clockwise from the top. */
  const PW = 300, CX = 150, CY = 150, RAD = 108;
  const pt = (c, n, r) => { const a = (c / n) * 2 * Math.PI - Math.PI / 2; return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) }; };
  function slicePath(a, b, n) {
    if (b - a <= 0) return '';
    if (b - a >= n) return `M${CX} ${CY - RAD} A${RAD} ${RAD} 0 1 1 ${CX - 0.01} ${CY - RAD} Z`;
    const p = pt(a, n, RAD), q = pt(b, n, RAD);
    return `M${CX} ${CY} L${p.x} ${p.y} A${RAD} ${RAD} 0 ${(b - a) / n > 0.5 ? 1 : 0} 1 ${q.x} ${q.y} Z`;
  }
  function pie(box, o) {
    const n = o.n, k = o.cats.length, legendId = `legend-${Math.random().toString(36).slice(2, 8)}`;
    const cumTo = i => o.values.slice(0, i + 1).reduce((s, x) => s + x, 0);
    // The parts: one light tick per equal share, so the snapping is visible.
    let ticks = '';
    if (n <= 60) for (let j = 0; j < n; j++) { const p = pt(j, n, RAD), q = pt(j, n, RAD + 5); ticks += `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" class="c-tickmark"/>`; }
    const slices = o.cats.map((c, i) => `<path class="c-slice${c === 'Yellow' ? ' on-light' : Pics.COLOR[c] ? ' on-color' : ''}" data-s="${i}" fill="${fill(c, i)}"/><text class="c-slab" data-t="${i}" text-anchor="middle">${esc(fmt(c))}</text>`).join('');
    const edges = o.edit ? o.cats.slice(0, -1).map((c, i) => `<g class="c-edge" data-i="${i}" tabindex="0" role="slider" aria-label="Edge after ${esc(fmt(c))}" aria-valuemin="0" aria-valuemax="${n}"><line x1="${CX}" y1="${CY}" class="c-edgeline"/><circle r="22" fill="transparent" class="c-grab"/><circle r="8" class="c-knob"/></g>`).join('') : '';
    const label = o.edit ? ` aria-describedby="${legendId}"` : ` role="img" aria-label="Pie chart. ${esc(o.cats.map((c, i) => `${fmt(c)}: ${o.values[i]} of ${n}`).join(', '))}."`;
    box.innerHTML = `<svg class="chart pie${o.edit ? ' c-dragging' : ''}" viewBox="-60 14 ${PW + 120} ${PW - 28}"${label}><circle cx="${CX}" cy="${CY}" r="${RAD}" class="c-rim"/>${slices}<circle cx="${CX}" cy="${CY}" r="${RAD}" class="c-outline"/>${ticks}${edges}</svg>${o.edit || o.legend ? `<ul class="c-legend" id="${legendId}"></ul>` : ''}`;
    const svg = box.querySelector('svg'), legend = box.querySelector('.c-legend');
    // Move every slice, name, edge and legend line to the current counts (the SVG itself stays, so a drag keeps going).
    function update() {
      let cum = 0;
      o.cats.forEach((c, i) => {
        const a = cum, b = cum + o.values[i]; cum = b;
        svg.querySelector(`[data-s="${i}"]`).setAttribute('d', slicePath(a, b, n));
        // Every slice is named: inside when there is room, just outside the circle when the slice is small. An empty slice has no name (the legend still lists it).
        const t = svg.querySelector(`[data-t="${i}"]`), big = o.values[i] / n >= 0.08, m = pt((a + b) / 2, n, big ? RAD * 0.62 : RAD + 14);
        t.setAttribute('x', m.x); t.setAttribute('y', m.y + 4); t.style.display = o.values[i] ? '' : 'none';
        t.setAttribute('text-anchor', big || Math.abs(m.x - CX) < 12 ? 'middle' : m.x > CX ? 'start' : 'end');
        if (i < k - 1 && o.edit) {
          const g = svg.querySelector(`[data-i="${i}"]`), p = pt(b, n, RAD);
          g.querySelector('line').setAttribute('x2', p.x); g.querySelector('line').setAttribute('y2', p.y);
          g.querySelectorAll('circle').forEach(ci => { ci.setAttribute('cx', p.x); ci.setAttribute('cy', p.y); });
          g.setAttribute('aria-valuenow', o.values[i]); g.setAttribute('aria-valuetext', `${fmt(c)}: ${o.values[i]} of ${n}`);
        }
      });
      // legend 'names': just which color is which (a reading question must not show its answer); otherwise each share too.
      if (legend) legend.innerHTML = o.cats.map((c, i) => `<li><span class="c-swatch" style="background:${fill(c, i)}" aria-hidden="true"></span>${esc(fmt(c))}${o.legend === 'names' ? '' : `: ${o.values[i]} of ${n} (${fmt(o.values[i] / n * 100)}%)`}</li>`).join('');
    }
    // Moving edge i changes slice i and slice i + 1; the edge stays between its neighbors.
    const setEdge = (i, c) => {
      const lo = cumTo(i - 1), hi = cumTo(i + 1), now = cumTo(i);
      c = Math.max(lo, Math.min(hi, Math.round(c)));
      if (c === now) return;
      o.values[i] += c - now; o.values[i + 1] -= c - now;
      update();
      if (o.onChange) o.onChange();
    };
    const partAt = e => { const p = svgPoint(svg, e); let a = Math.atan2(p.y - CY, p.x - CX) + Math.PI / 2; if (a < 0) a += 2 * Math.PI; return (a / (2 * Math.PI)) * n; };
    if (o.edit) svg.querySelectorAll('.c-edge').forEach(g => {
      const i = +g.dataset.i;
      g.addEventListener('pointerdown', e => { e.preventDefault(); g.focus(); try { g.setPointerCapture(e.pointerId); } catch (err) { /* no capture to take */ } });
      // Past 12 o'clock the angle wraps from the last part to 0: take whichever of c, c - n, c + n is nearest the edge's place.
      g.addEventListener('pointermove', e => { if (!g.hasPointerCapture(e.pointerId)) return; const now = cumTo(i), c = partAt(e); setEdge(i, [c, c - n, c + n].reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a))); });
      g.addEventListener('keydown', e => {
        const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
        if (d !== undefined) { e.preventDefault(); setEdge(i, cumTo(i) + d); }
      });
    });
    update();
    return { update };
  }

  /* ---------- Dot plot ----------
     o: { ticks (the number line's values, or category names), values (dots above each), edit, erase (taps
     take a dot away), onChange }. Tapping above a value adds a dot there; arrow keys add and take away. */
  const DW = 340, DL = 14, DR = 14;
  function dot(box, o) {
    const k = o.ticks.length, step = (DW - DL - DR) / k, r = Math.min(7, step * 0.38), gap = r * 2 + 2;
    const tall = Math.max(6, ...o.values) + (o.edit ? 2 : 0), base = 18 + tall * gap, H = base + 34;
    const x = i => DL + step * (i + 0.5);
    const every = k > 16 ? 2 : 1;
    const ticks = o.ticks.map((t, i) => `<line x1="${x(i)}" y1="${base}" x2="${x(i)}" y2="${base + 6}" class="c-axis"/>${i % every ? '' : `<text x="${x(i)}" y="${base + 20}" text-anchor="middle" class="c-lab">${esc(fmt(t))}</text>`}`).join('');
    const cols = o.ticks.map((t, i) => {
      const dots = Array.from({ length: o.values[i] }, (_, j) => `<circle cx="${x(i)}" cy="${base - r - 3 - j * gap}" r="${r}" class="c-dot"/>`).join('');
      const attrs = o.edit ? ` tabindex="0" role="slider" aria-label="Dots at ${esc(fmt(t))}" aria-valuemin="0" aria-valuemax="99" aria-valuenow="${o.values[i]}" aria-valuetext="${esc(fmt(t))}: ${o.values[i]} ${o.values[i] === 1 ? 'dot' : 'dots'}"` : '';
      return `<g class="c-col${o.edit ? ' c-tap' : ''}" data-i="${i}"${attrs}><rect x="${x(i) - step / 2}" y="4" width="${step}" height="${base}" fill="transparent"/>${dots}</g>`;
    }).join('');
    const label = o.edit ? '' : ` role="img" aria-label="Dot plot. ${esc(o.ticks.map((t, i) => `${fmt(t)}: ${o.values[i]}`).join(', '))}."`;
    box.innerHTML = `<svg class="chart" viewBox="0 0 ${DW} ${H}"${label}><line x1="${DL}" y1="${base}" x2="${DW - DR}" y2="${base}" class="c-axis"/>${ticks}${cols}</svg>`;
    if (!o.edit) return;
    const change = (i, d) => {
      const v = Math.max(0, o.values[i] + d);
      if (v === o.values[i]) return;
      o.values[i] = v; dot(box, o);
      const g = box.querySelector(`[data-i="${i}"]`); if (g) g.focus();
      if (o.onChange) o.onChange();
    };
    box.querySelectorAll('.c-col').forEach(g => {
      const i = +g.dataset.i;
      g.addEventListener('click', () => change(i, o.erase && o.erase() ? -1 : 1));
      g.addEventListener('keydown', e => {
        const d = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
        if (d !== undefined) { e.preventDefault(); change(i, d); }
      });
    });
  }

  /* ---------- Stem-and-leaf plot (finished) ---------- rows: [[stem, [leaves]]], key: "5 | 8 means 58". */
  function stem(box, ch) {
    box.innerHTML = `<table class="stem"><caption>Stem | Leaf</caption><tbody>${ch.rows.map(([s, l]) => `<tr><th scope="row">${s}</th><td>${l.join(' ')}</td></tr>`).join('')}</tbody></table>${ch.key ? `<p class="stem-key">Key: ${esc(ch.key)}</p>` : ''}`;
  }

  /* ---------- Box plot ----------
     o: { axis: { lo, hi, step }, values: [lo whisker, Q1, median, Q3, hi whisker], out (outlier dots), edit, snap, onChange }.
     Each of the five handles is dragged along the number line (or set with the arrow keys), and stays between its neighbors. */
  const XW = 340, XL = 18, XR = 18, NAMES5 = ['Lower whisker', 'Q1', 'Median', 'Q3', 'Upper whisker'];
  function boxPlot(box, o) {
    const { lo, hi, step } = o.axis, X = v => XL + (XW - XL - XR) * (v - lo) / (hi - lo), BY = 30, BH = 34, AY = 96, H = o.edit ? 150 : 122, snap = o.snap || 0.5;
    let ticks = '';
    for (let t = lo; t <= hi + 1e-9; t += step) ticks += `<line x1="${X(t)}" y1="${AY}" x2="${X(t)}" y2="${AY + 6}" class="c-axis"/><text x="${X(t)}" y="${AY + 20}" text-anchor="middle" class="c-lab">${fmt(t)}</text>`;
    const label = o.edit ? '' : ` role="img" aria-label="Box plot. Lower whisker ${fmt(o.values[0])}, Q1 ${fmt(o.values[1])}, median ${fmt(o.values[2])}, Q3 ${fmt(o.values[3])}, upper whisker ${fmt(o.values[4])}${o.out.length ? `; outliers ${o.out.map(fmt).join(', ')}` : ''}."`;
    const handles = o.edit ? NAMES5.map((nm, i) => `<g class="c-knobg" data-i="${i}" tabindex="0" role="slider" aria-label="${nm}" aria-valuemin="${lo}" aria-valuemax="${hi}"><rect class="c-grabx" y="${BY - 18}" width="30" height="${AY - BY + 46}" fill="transparent"/><line class="c-hline" y1="${BY - 8}" y2="${AY + 30}"/><circle class="c-knob" cy="${AY + 36}" r="7"/></g>`).join('') : '';
    box.innerHTML = `<svg class="chart${o.edit ? ' c-dragging' : ''}" viewBox="0 0 ${XW} ${H}"${label}><line x1="${XL}" y1="${AY}" x2="${XW - XR}" y2="${AY}" class="c-axis"/>${ticks}<g class="c-boxg"></g>${o.out.map(x => `<circle cx="${X(x)}" cy="${BY + BH / 2}" r="5" class="c-outdot"/>`).join('')}${handles}</svg>`;
    const svg = box.querySelector('svg'), g = svg.querySelector('.c-boxg');
    function update() {
      const [a, q1, m, q3, b] = o.values.map(X), mid = BY + BH / 2;
      g.innerHTML = `<line x1="${a}" y1="${mid}" x2="${q1}" y2="${mid}" class="c-whisk"/><line x1="${q3}" y1="${mid}" x2="${b}" y2="${mid}" class="c-whisk"/><line x1="${a}" y1="${BY + 8}" x2="${a}" y2="${BY + BH - 8}" class="c-whisk"/><line x1="${b}" y1="${BY + 8}" x2="${b}" y2="${BY + BH - 8}" class="c-whisk"/><rect x="${q1}" y="${BY}" width="${Math.max(0, q3 - q1)}" height="${BH}" class="c-boxr"/><line x1="${m}" y1="${BY}" x2="${m}" y2="${BY + BH}" class="c-med"/>`;
      if (!o.edit) return;
      svg.querySelectorAll('.c-knobg').forEach(h => {
        const i = +h.dataset.i, x = X(o.values[i]);
        h.querySelector('rect').setAttribute('x', x - 15); h.querySelector('line').setAttribute('x1', x); h.querySelector('line').setAttribute('x2', x); h.querySelector('circle').setAttribute('cx', x);
        h.setAttribute('aria-valuenow', o.values[i]); h.setAttribute('aria-valuetext', `${NAMES5[i]}: ${fmt(o.values[i])}`);
      });
    }
    const setV = (i, v) => {
      const lo2 = i ? o.values[i - 1] : lo, hi2 = i < 4 ? o.values[i + 1] : hi;
      v = Math.max(lo2, Math.min(hi2, +(Math.round(v / snap) * snap).toFixed(6)));
      if (v === o.values[i]) return;
      o.values[i] = v; update(); if (o.onChange) o.onChange();
    };
    update();
    if (!o.edit) return;
    // Handles at the same value sit on top of each other, and each is held between its neighbors, so the one on top might
    // not be free to move. The first move decides: leftward takes the lowest of them, rightward the highest.
    const knobs = [...svg.querySelectorAll('.c-knobg')];
    knobs.forEach(h => {
      const i = +h.dataset.i, toV = e => lo + (svgPoint(svg, e).x - XL) / (XW - XL - XR) * (hi - lo);
      let pick = null;   // the handle this drag moves, once known
      h.addEventListener('pointerdown', e => {
        e.preventDefault(); h.focus(); try { h.setPointerCapture(e.pointerId); } catch (err) { /* no capture to take */ }
        const group = o.values.map((x, j) => j).filter(j => o.values[j] === o.values[i]);
        pick = group.length === 1 ? i : { group };
      });
      h.addEventListener('pointermove', e => {
        if (!h.hasPointerCapture(e.pointerId) || pick === null) return;
        const v = toV(e);
        if (typeof pick === 'object') {
          if (Math.abs(v - o.values[i]) < snap / 2) return;   // not moved far enough to tell which way
          pick = v < o.values[i] ? Math.min(...pick.group) : Math.max(...pick.group);
          if (pick !== i) knobs[pick].focus();
        }
        setV(pick, v);
      });
      h.addEventListener('pointerup', () => { pick = null; });
      h.addEventListener('pointercancel', () => { pick = null; });
      h.addEventListener('keydown', e => {
        const d = { ArrowRight: snap, ArrowUp: snap, ArrowLeft: -snap, ArrowDown: -snap, PageUp: step, PageDown: -step }[e.key];
        if (d !== undefined) { e.preventDefault(); setV(i, o.values[i] + d); }
      });
    });
  }

  /* ---------- Line graph ----------
     o: { labels (along the bottom), values (null until placed), axis: { lo, hi, step }, edit, snap, onChange }.
     A point is dragged up and down its column (a finger taps instead, so the page still scrolls), or set with the arrow keys;
     the placed points are joined in order. An axis that doesn't start at 0 shows a break mark. */
  const LW = 340, LL = 44, LR = 10, LT = 12;
  function line(box, o) {
    const k = o.labels.length, { lo, hi, step } = o.axis, snap = o.snap || 1, colW = (LW - LL - LR) / k;
    const tilt = k > 10, LB = tilt ? 44 : 30, H = 240, plotH = H - LT - LB;
    const Y = v => LT + plotH * (1 - (v - lo) / (hi - lo)), X = i => LL + colW * (i + 0.5);
    let grid = '';
    for (let t = lo; t <= hi + 1e-9; t += step) grid += `<line x1="${LL}" y1="${Y(t)}" x2="${LW - LR}" y2="${Y(t)}" class="c-grid"/><text x="${LL - 6}" y="${Y(t) + 4}" text-anchor="end" class="c-tick">${fmt(t)}</text>`;
    const brk = lo > 0 ? `<path d="M${LL - 5} ${LT + plotH - 4} l5 -4 l5 4 l-5 4 z" class="c-break"/>` : '';
    // A long stretch labels about 12 of its points (the questions name only those).
    const every = k > 20 ? Math.ceil(k / 12) : 1;
    const labels = o.labels.map((l, i) => (i % every ? '' : tilt ? `<text transform="translate(${X(i) + 4} ${LT + plotH + 10}) rotate(-45)" text-anchor="end" class="c-lab">${esc(l)}</text>` : `<text x="${X(i)}" y="${LT + plotH + 18}" text-anchor="middle" class="c-lab">${esc(l)}</text>`)).join('');
    const cols = o.labels.map((l, i) => `<g class="c-col${o.edit ? ' c-edit' : ''}" data-i="${i}"${o.edit ? ` tabindex="0" role="slider" aria-label="${esc(l)}" aria-valuemin="${lo}" aria-valuemax="${hi}"` : ''}><rect class="c-lhit" x="${X(i) - colW / 2}" y="${LT}" width="${colW}" height="${plotH}" fill="transparent"/><circle r="${k > 20 ? 3 : 5}" class="c-lpt"/></g>`).join('');
    const label = o.edit ? '' : ` role="img" aria-label="Line graph. ${esc(o.labels.map((l, i) => `${l}: ${fmt(o.values[i])}`).join(', '))}."`;
    box.innerHTML = `<svg class="chart${o.edit ? ' c-editing' : ''}" viewBox="0 0 ${LW} ${H}"${label}>${grid}<line x1="${LL}" y1="${LT}" x2="${LL}" y2="${LT + plotH}" class="c-axis"/><line x1="${LL}" y1="${LT + plotH}" x2="${LW - LR}" y2="${LT + plotH}" class="c-axis"/>${brk}<polyline class="c-lline"/>${cols}${labels}</svg>`;
    const svg = box.querySelector('svg');
    function update() {
      const pts = o.values.map((v, i) => (v === null ? null : `${X(i)},${Y(v)}`));
      // The line joins each run of placed points, in order.
      svg.querySelector('.c-lline').setAttribute('points', pts.every(p => p !== null) ? pts.join(' ') : pts.filter(p => p !== null).join(' '));
      svg.querySelectorAll('.c-col').forEach(g => {
        const i = +g.dataset.i, v = o.values[i], c = g.querySelector('circle');
        if (v === null) c.setAttribute('display', 'none'); else { c.removeAttribute('display'); c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(v)); }
        if (o.edit) { g.setAttribute('aria-valuenow', v === null ? lo : v); g.setAttribute('aria-valuetext', v === null ? `${o.labels[i]}: not placed` : `${o.labels[i]}: ${fmt(v)}`); }
      });
    }
    const setV = (i, v) => { v = Math.max(lo, Math.min(hi, +(Math.round(v / snap) * snap).toFixed(6))); if (v === o.values[i]) return; o.values[i] = v; update(); if (o.onChange) o.onChange(); };
    update();
    if (!o.edit) return;
    svg.querySelectorAll('.c-col').forEach(g => {
      const i = +g.dataset.i, toV = e => lo + (1 - (svgPoint(svg, e).y - LT) / plotH) * (hi - lo);
      let touch = null;
      g.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') { touch = { x: e.clientX, y: e.clientY }; return; }
        e.preventDefault(); g.focus(); setV(i, toV(e)); try { g.setPointerCapture(e.pointerId); } catch (err) { /* no capture to take */ }
      });
      g.addEventListener('pointermove', e => { if (g.hasPointerCapture(e.pointerId)) setV(i, toV(e)); });
      g.addEventListener('pointerup', e => { if (e.pointerType === 'touch' && touch && Math.hypot(e.clientX - touch.x, e.clientY - touch.y) < 10) { g.focus(); setV(i, toV(e)); } touch = null; });
      g.addEventListener('pointercancel', () => { touch = null; });
      g.addEventListener('keydown', e => {
        const d = { ArrowUp: snap, ArrowRight: snap, ArrowDown: -snap, ArrowLeft: -snap, PageUp: step, PageDown: -step }[e.key];
        if (d !== undefined) { e.preventDefault(); setV(i, (o.values[i] === null ? Math.round((lo + hi) / 2 / snap) * snap : o.values[i]) + (o.values[i] === null ? 0 : d)); }
      });
    });
  }

  /* ---------- Normal curve ----------
     o: { lo, hi (the number line), mu, sd (the curve's center and spread), and either a histogram under it
     (bins: each bin's start, counts, w, n) or model: true (a curve alone, marked at the mean and 1, 2 and 3 SDs
     each side), edit, snap, onChange }. Two handles below the number line move the center and the spread (the
     spread handle sits one SD right of the center). */
  const CW = 340, CL = 44, CR = 12, CT = 14;
  function curve(box, o) {
    const bars = !!o.counts, CB = o.edit ? 92 : bars ? 36 : 46, H = bars ? 250 + (o.edit ? 56 : 0) : 220, plotH = H - CT - CB, plotW = CW - CL - CR, base = CT + plotH;
    const X = x => CL + plotW * (x - o.lo) / (o.hi - o.lo), snap = o.snap || 1;
    // Headroom above the tallest bar, so a well-fitted curve's peak isn't cut off.
    const maxC = bars ? Math.ceil(Math.max(...o.counts) * 1.2) : 0, step = bars ? Displays.goodStep(maxC) : 0, top = bars ? Displays.topFor(step, maxC) : 1;
    // The curve's height at x: for a histogram, scaled so its area matches the bars' (n values in bins w wide).
    const height = (x, mu, sd) => (bars ? o.n * o.w : 1) / (sd * Math.sqrt(2 * Math.PI)) * Math.exp(-0.5 * ((x - mu) / sd) ** 2);
    const yTop = bars ? top : height(o.mu, o.mu, o.sd) * 1.12, Y = c => CT + plotH * (1 - c / yTop);
    let grid = '', axis = '';
    if (bars) {
      for (let c = 0; c <= top; c += step) grid += `<line x1="${CL}" y1="${Y(c)}" x2="${CW - CR}" y2="${Y(c)}" class="c-grid"/><text x="${CL - 6}" y="${Y(c) + 4}" text-anchor="end" class="c-tick">${c}</text>`;
      const edges = [...o.bins, o.bins[o.bins.length - 1] + o.w], every = Math.ceil(edges.length / 8);
      axis = edges.map((a, i) => `<line x1="${X(a)}" y1="${base}" x2="${X(a)}" y2="${base + 5}" class="c-axis"/>${i % every ? '' : `<text x="${X(a)}" y="${base + 17}" text-anchor="middle" class="c-lab">${fmt(a)}</text>`}`).join('');
    } else for (let k = -3; k <= 3; k++) {
      const x = X(o.mu + k * o.sd);
      axis += `<line x1="${x}" y1="${CT}" x2="${x}" y2="${base}" class="c-grid"/><line x1="${x}" y1="${base}" x2="${x}" y2="${base + 5}" class="c-axis"/><text x="${x}" y="${base + 17}" text-anchor="middle" class="c-lab">${fmt(+(o.mu + k * o.sd).toFixed(6))}</text><text x="${x}" y="${base + 31}" text-anchor="middle" class="c-tick">${k ? `${k > 0 ? '+' : '−'}${Math.abs(k)} SD` : 'mean'}</text>`;
    }
    const rects = bars ? o.bins.map((a, i) => `<rect class="c-bar" x="${X(a)}" y="${Y(o.counts[i])}" width="${X(a + o.w) - X(a)}" height="${base - Y(o.counts[i])}" fill="${SHADES[0]}"/>`).join('') : '';
    const NAME = ['Center', 'Spread'];
    const handles = o.edit ? NAME.map((nm, i) => `<g class="c-knobg" data-i="${i}" tabindex="0" role="slider" aria-label="${nm}"><rect y="${CT}" width="30" height="${plotH + 52}" fill="transparent"/><line class="c-hline" y1="${CT}" y2="${base}"/><line class="c-hline" y1="${base + 22}" y2="${base + 26}"/><circle class="c-knob" cy="${base + 34}" r="8"/><text class="c-lab" y="${base + (i ? 74 : 58)}" text-anchor="middle">${nm}</text></g>`).join('') : '';
    const label = o.edit ? '' : ` role="img" aria-label="${bars ? `Histogram with a normal curve over it, centered at ${fmt(Stats.round(o.mu, 1))} with a spread of ${fmt(Stats.round(o.sd, 1))}. Bars from ${fmt(o.bins[0])}, ${fmt(o.w)} wide: ${o.counts.join(', ')}.` : `Normal curve with mean ${fmt(o.mu)} and standard deviation ${fmt(o.sd)}, marked at ${[-3, -2, -1, 0, 1, 2, 3].map(k => fmt(+(o.mu + k * o.sd).toFixed(6))).join(', ')}.`}"`;
    const clip = `dc-clip-${Math.random().toString(36).slice(2, 8)}`;
    box.innerHTML = `<svg class="chart${o.edit ? ' c-dragging' : ''}" viewBox="0 0 ${CW} ${H}"${label}><defs><clipPath id="${clip}"><rect x="${CL}" y="${CT - 2}" width="${plotW}" height="${plotH + 2}"/></clipPath></defs>${grid}${rects}${axis}<line x1="${CL}" y1="${base}" x2="${CW - CR}" y2="${base}" class="c-axis"/>${bars ? `<line x1="${CL}" y1="${CT}" x2="${CL}" y2="${base}" class="c-axis"/><text transform="translate(12 ${CT + plotH / 2}) rotate(-90)" text-anchor="middle" class="c-lab">Count</text>` : ''}<polyline class="c-curve" clip-path="url(#${clip})"/>${handles}</svg>`;
    const svg = box.querySelector('svg');
    function update() {
      const pts = [];
      for (let j = 0; j <= 120; j++) { const x = o.lo + (o.hi - o.lo) * j / 120; pts.push(`${X(x).toFixed(1)},${Y(height(x, o.mu, o.sd)).toFixed(1)}`); }
      svg.querySelector('.c-curve').setAttribute('points', pts.join(' '));
      if (!o.edit) return;
      svg.querySelectorAll('.c-knobg').forEach(h => {
        const i = +h.dataset.i, v = i ? o.mu + o.sd : o.mu, x = X(v);
        h.querySelector('rect').setAttribute('x', x - 15); h.querySelectorAll('line').forEach(l => { l.setAttribute('x1', x); l.setAttribute('x2', x); }); h.querySelector('circle').setAttribute('cx', x); h.querySelector('text').setAttribute('x', x);
        h.setAttribute('aria-valuemin', i ? snap : o.lo); h.setAttribute('aria-valuemax', i ? (o.hi - o.lo) / 2 : o.hi);
        h.setAttribute('aria-valuenow', i ? o.sd : o.mu); h.setAttribute('aria-valuetext', i ? `Spread: ${fmt(o.sd)}, one standard deviation, out to ${fmt(+(o.mu + o.sd).toFixed(6))}` : `Center: ${fmt(o.mu)}`);
      });
    }
    // The center moves the whole curve; the spread handle sets how far one SD reaches from the center.
    const tidy = v => +(Math.round(v / snap) * snap).toFixed(6);
    const setV = (i, v) => {
      if (i) { const s = Math.max(snap, Math.min((o.hi - o.lo) / 2, tidy(v))); if (s === o.sd) return; o.sd = s; } else { const m = Math.max(o.lo, Math.min(o.hi, tidy(v))); if (m === o.mu) return; o.mu = m; }
      update(); if (o.onChange) o.onChange();
    };
    update();
    if (!o.edit) return;
    svg.querySelectorAll('.c-knobg').forEach(h => {
      const i = +h.dataset.i, toV = e => { const x = o.lo + (svgPoint(svg, e).x - CL) / plotW * (o.hi - o.lo); return i ? x - o.mu : x; };
      h.addEventListener('pointerdown', e => { e.preventDefault(); h.focus(); try { h.setPointerCapture(e.pointerId); } catch (err) { /* no capture to take */ } });
      h.addEventListener('pointermove', e => { if (h.hasPointerCapture(e.pointerId)) setV(i, toV(e)); });
      h.addEventListener('keydown', e => {
        const d = { ArrowRight: snap, ArrowUp: snap, ArrowLeft: -snap, ArrowDown: -snap, PageUp: 5 * snap, PageDown: -5 * snap }[e.key];

/* Data Coach screens. The tool opens in the Data Lab: choose a kind of data and its settings, make

(() => {

  const valueHtml = (d, x) => { const p = Pics.value(d, x); return p ? p.html + (p.label ? `<span class="sr">${esc(p.label)}</span>` : '') : esc(fmt(x)); };

  }
  function renderHome() {
    $('home-levels').innerHTML = Tasks.LEVELS.map(l => `<button class="big" data-level="${l.n}">Level ${l.n}: ${esc(l.title)}<small>${l.themes.map(t => esc(t.title)).join(' · ')}</small></button>`).join('');

  /* ---------- The Data Lab ----------

  function renderLearn() {

  // The data: the values in the order they were collected, or a frequency table.

    } else if (t.ask === 'stem') {
      box.innerHTML = `<div class="data-scroll"><table class="freq stem-in"><thead><tr><th scope="col">Stem</th><th scope="col">Leaves</th></tr></thead><tbody>${t.rows.map(([s], i) => `<tr><th scope="row">${s}</th><td><input type="text" inputmode="numeric" data-stem="${i}" aria-label="Leaves for stem ${s}" autocomplete="off"></td></tr>`).join('')}</tbody></table></div>`;
      box.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); checkNow(); } }));
    } else box.innerHTML = '';
  }
  function drawBox() {
    const t = cur.task;
    Charts.boxPlot($('chart-work'), { axis: t.axis, values: cur.box.values, out: t.out, edit: !cur.solved, snap: t.snap, onChange: () => { if (!cur.solved) say(''); } });
  }
  function drawCurve() {
    const t = cur.task;
    Charts.curve($('chart-work'), Object.assign(cur.curve, t.chart, { edit: !cur.solved, snap: t.snap, onChange: () => { if (!cur.solved) say(''); } }));
  }
  function drawLine() {
    const t = cur.task;
    Charts.line($('chart-work'), { labels: t.labels, values: cur.line.values, axis: t.axis, snap: t.snap, edit: !cur.solved, onChange: () => { if (!cur.solved) say(''); } });
  }
  function drawDot() {
    const t = cur.task;
    Charts.dot($('chart-work'), { ticks: t.ticks, values: cur.dot.values, edit: !cur.solved, erase: () => cur.dot.erase, onChange: () => { if (!cur.solved) say(''); } });
  }
  function drawHist() {
    const t = cur.task, h = cur.hist;
    if (!h.w) { $('chart-work').innerHTML = '<p class="note">Choose a bin width to see the bins.</p>'; return; }
    const { bins } = t.binsOf(h.w), sc = t.topOf(h.w);
    Charts.bar($('chart-work'), { cats: bins.map(b => b.label), values: h.values, step: sc.step, top: sc.top, edit: !cur.solved, hist: true, onChange: () => { if (!cur.solved) say(''); } });
  }
  function pickWidth(w) {
    if (cur.solved) return;
    const t = cur.task, v = t.verdict(w);
    if (!v.ok) { cur.tries++; say(esc(v.msg), 'bad'); return; }
    cur.hist = { w, values: t.binsOf(w).bins.map(() => 0) };
    $('work').querySelectorAll('[data-width]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.width === w)));
    drawHist();
    say(`${esc(v.msg)} Now drag each bar (or use the arrow keys) to how many values are in its range.`, 'info');
  }
  // The current drawing, and the right one, as lists to compare (for Show Next Step and Quick Draw).
  function stemInputs() { return [...$('work').querySelectorAll('[data-stem]')]; }

  // ---------- Drawing a bar graph or a pie chart ----------
  function drawBar() {
    const t = cur.task, b = cur.bar;
    Charts.bar($('chart-work'), { cats: t.cats, values: b.values, step: b.step, top: b.step ? t.top(b.step) : 1, edit: !cur.solved, hist: t.hist, onChange: () => { if (!cur.solved) say(''); } });
  }
  function pickStep(s) {
    if (cur.solved) return;
    const t = cur.task, v = t.scale(s);
    if (!v.ok) { cur.tries++; say(esc(v.msg), 'bad'); return; }
    cur.bar.step = s;
    const top = t.top(s);
    cur.bar.values = cur.bar.values.map(x => Math.min(x, top));
    $('work').querySelectorAll('[data-step]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.step === s)));
    drawBar();
    say(`${esc(v.msg)} Now drag each bar (or use the arrow keys) to its count.`, 'info');
  }
  function checkDrawing() {
    const t = cur.task;
    if (t.ask === 'bar' && !cur.bar.step) { say('Choose a scale for the count axis first.', 'info'); return; }
    if (t.ask === 'hist' && !cur.hist.w) { say('Choose a bin width first.', 'info'); return; }
    const r = { bar: () => t.check(cur.bar.values, cur.bar.step), pie: () => t.check(cur.pie.values), dot: () => t.check(cur.dot.values), hist: () => t.check(cur.hist.values, cur.hist.w), stem: () => t.check(stemInputs().map(i => i.value)), box: () => t.check(cur.box.values), line: () => t.check(cur.line.values), curve: () => t.check(cur.curve) }[t.ask]();
    if (r.status === 'right') { solved(esc(r.msg)); freeze(); return; }
    cur.tries++;
    say(esc(r.msg), KIND[r.status]);
  }
  // A finished drawing stays on screen but can no longer be changed.
  function freeze() {
    const t = cur.task;
    if (t.ask === 'bar') drawBar();
    else if (t.ask === 'pie') Charts.pie($('chart-work'), { cats: t.cats, values: cur.pie.values, n: t.n, edit: false, legend: true });
    else if (t.ask === 'dot') { drawDot(); if ($('erase')) $('erase').hidden = true; }
    else if (t.ask === 'hist') drawHist();
    else if (t.ask === 'box') drawBox();
    else if (t.ask === 'line') drawLine();
    else if (t.ask === 'curve') drawCurve();
    else stemInputs().forEach(i => { i.readOnly = true; });
  }
  // Show Next Step: the scale first, then one bar (or one pie edge) at a time. Quick Draw does it all at once.
  function drawStep(all) {
    const t = cur.task;
    cur.tries++;
    if (t.ask === 'dot') {
      const v = cur.dot.values, i = t.ticks.findIndex((x, j) => v[j] !== t.counts[j]);
      if (all) t.counts.forEach((c, j) => { v[j] = c; }); else if (i >= 0) v[i] = t.counts[i];
      if (!t.ticks.some((x, j) => v[j] !== t.counts[j])) { solved('That is the dot plot: one dot for each value.', true); freeze(); }
      else { drawDot(); say(`${esc(fmt(t.ticks[i]))} is in the list ${t.counts[i]} ${t.counts[i] === 1 ? 'time' : 'times'}: ${t.counts[i]} ${t.counts[i] === 1 ? 'dot' : 'dots'}.`, 'info'); }
      return;
    }
    if (t.ask === 'hist') {
      if (!cur.hist.w) { pickWidth(t.good); if (!all) return; }
      const { bins, counts } = t.binsOf(cur.hist.w), v = cur.hist.values, i = bins.findIndex((b, j) => v[j] !== counts[j]);
      if (all) counts.forEach((c, j) => { v[j] = c; }); else if (i >= 0) v[i] = counts[i];
      if (!bins.some((b, j) => v[j] !== counts[j])) { solved('That is the histogram: each bar counts the values in its range.', true); freeze(); }
      else { drawHist(); say(`${bins[i].label}: ${counts[i]} ${counts[i] === 1 ? 'value' : 'values'} from ${fmt(bins[i].a)} to ${fmt(bins[i].b)}.`, 'info'); }
      return;
    }
    if (t.ask === 'box') {
      // One handle at a time, middle out: the median, then Q1 and Q3, then the whiskers.
      const order = [2, 1, 3, 0, 4], NAMES = ['The lower whisker', 'Q1', 'The median', 'Q3', 'The upper whisker'], v = cur.box.values;
      const i = order.find(j => v[j] !== t.want[j]);
      if (all) t.want.forEach((x, j) => { v[j] = x; }); else if (i !== undefined) { v[i] = t.want[i]; for (let j = 0; j < 5; j++) if (j < i && v[j] > v[i]) v[j] = v[i]; else if (j > i && v[j] < v[i]) v[j] = v[i]; }
      if (!t.want.some((x, j) => v[j] !== x)) { solved('That is the box plot: the box is the middle half, and the whiskers reach the least and greatest values that aren’t outliers.', true); freeze(); }
      else { drawBox(); say(`${NAMES[i]}: ${fmt(t.want[i])}.`, 'info'); }
      return;
    }
    if (t.ask === 'curve') {
      // The center first (at the mean), then the spread (one standard deviation).
      const c = cur.curve, tidy = x => +(Math.round(x / t.snap) * t.snap).toFixed(6), centerOk = Math.abs(c.mu - t.mu) <= 0.35 * t.sig;
      if (all || !centerOk) c.mu = tidy(t.mu);
      if (all || centerOk) c.sd = Math.max(t.snap, tidy(t.sig));
      if (t.check(c).status === 'right') { solved(`That is the curve: centered at the mean, about ${fmt(Stats.round(t.mu, 1))}, with a spread of one standard deviation, about ${fmt(Stats.round(t.sig, 1))}.`, true); freeze(); }
      else { drawCurve(); say(`The center goes at the mean: about ${fmt(Stats.round(t.mu, 1))}. Next, drag the spread handle out one standard deviation.`, 'info'); }
      return;
    }
    if (t.ask === 'line') {
      const v = cur.line.values, src = t.set.values, i = v.findIndex((x, j) => x === null || Math.abs(x - src[j]) > t.snap / 2 + 1e-9);
      const near = x => +(Math.round(x / t.snap) * t.snap).toFixed(6);
      if (all) src.forEach((x, j) => { v[j] = near(x); }); else if (i >= 0) v[i] = near(src[i]);
      if (!src.some((x, j) => v[j] === null || Math.abs(v[j] - x) > t.snap / 2 + 1e-9)) { solved('That is the line graph: a point for each value, joined in order.', true); freeze(); }
      else { drawLine(); say(`${esc(t.labels[i])}: ${fmt(src[i])}.`, 'info'); }
      return;
    }
    if (t.ask === 'stem') {
      const ins = stemInputs(), i = t.rows.findIndex(([s, l], j) => ins[j].value.replace(/[^0-9]/g, '') !== l.join(''));
      (all ? t.rows.map((r, j) => j) : [i]).forEach(j => { if (j >= 0) ins[j].value = t.rows[j][1].join(' '); });
      if (!t.rows.some(([s, l], j) => ins[j].value.replace(/[^0-9]/g, '') !== l.join(''))) { solved('That is the stem-and-leaf plot: every value has its leaf, in order.', true); freeze(); }
      else say(`Stem ${t.rows[i][0]}: ${t.rows[i][1].length ? t.rows[i][1].map(l => fmt(t.valueOf(t.rows[i][0], l))).join(', ') : 'no values'}, so the leaves are ${t.rows[i][1].join(' ') || 'none'}.`, 'info');
      return;
    }
    if (t.ask === 'bar') {
      if (!cur.bar.step) { pickStep(t.good); if (!all) return; }
      const i = t.cats.findIndex((c, j) => cur.bar.values[j] !== t.counts[j]);
      if (all) t.counts.forEach((c, j) => { cur.bar.values[j] = c; }); else if (i >= 0) cur.bar.values[i] = t.counts[i];
      drawBar();
      const left = t.cats.some((c, j) => cur.bar.values[j] !== t.counts[j]);
      if (!left) { const g = t.hist ? 'histogram' : 'bar graph'; solved(`${all ? 'Here' : 'That'} is the ${g}: each bar reaches its count.`, true); drawBar(); }
      else say(`${esc(fmt(t.cats[i]))}: ${t.counts[i]}, so its bar goes up to ${t.counts[i]} on the scale.`, 'info');
    } else {
      const k = t.cats.length, i = all ? k - 1 : t.cats.findIndex((c, j) => cur.pie.values[j] !== t.counts[j]);
      const v = cur.pie.values = Displays.pieStep(cur.pie.values, t.counts, i);
      if (!t.cats.some((c, j) => v[j] !== t.counts[j])) { solved('That is the pie chart: each slice has as many parts as its count.', true); freeze(); }
      else { say(`${esc(fmt(t.cats[i]))}: ${t.counts[i]} of the ${t.n} parts.`, 'info'); Charts.pie($('chart-work'), { cats: t.cats, values: v, n: t.n, edit: true, onChange: () => { if (!cur.solved) say(''); } }); }
    }
  }

  // ---------- Choices ----------
  // A wrong pick stays focusable (aria-disabled, not disabled), so the student never loses their place.
  function pick(b) {
    if (cur.solved || b.getAttribute('aria-disabled') === 'true') return;
    const c = cur.task.choices[+b.dataset.c];
    if (c.right) {
      b.classList.add('right');
      $('work').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-disabled', 'true'));
      solved(c.msg || 'Right!');
    } else {
      // An almost-right choice (the right idea, a small slip) is marked Almost, not wrong.
      b.classList.add(c.almost ? 'almost' : 'wrong'); b.setAttribute('aria-disabled', 'true'); cur.tries++;
      say(`${c.almost ? 'Almost: ' : ''}${c.msg || 'Not this one.'}${cur.mode === 'mist' ? ' Choose again.' : ''}`, c.almost ? 'almost' : 'bad');
    }
  }
  function toggle(b) {
    if (cur.solved) return;
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  }
  function checkMulti() {
    const t = cur.task, bs = [...$('work').querySelectorAll('[data-c]')];
    if (!bs.some(b => b.getAttribute('aria-pressed') === 'true')) { say('Choose at least one.', 'info'); return; }
    const ok = bs.every(b => (b.getAttribute('aria-pressed') === 'true') === !!t.choices[+b.dataset.c].right);
    if (ok) { bs.forEach(b => { if (t.choices[+b.dataset.c].right) b.classList.add('right'); b.setAttribute('aria-disabled', 'true'); }); solved(`Right! ${t.msg}`); return; }
    cur.tries++;
    say(cur.tries < 2 ? `Not quite. ${t.hints[0]}` : `Not quite. ${t.msg}`, 'bad');
  }

  // ---------- Tally ----------
  function tallySvg(n) {
    const groups = Math.ceil(n / 5), w = Math.max(1, groups) * 38;
    let s = '';
    for (let g = 0; g < groups; g++) {
      const k = Math.min(5, n - g * 5), x0 = g * 38 + 4;
      for (let j = 0; j < Math.min(4, k); j++) s += `<line x1="${x0 + j * 7}" y1="4" x2="${x0 + j * 7}" y2="24"/>`;
      if (k === 5) s += `<line class="slash" x1="${x0 - 3}" y1="20" x2="${x0 + 24}" y2="8"/>`;
    }
    return `<svg viewBox="0 0 ${w} 28" width="${w}" aria-hidden="true">${s}</svg>`;
  }
  function renderTally() {
    const t = cur.task, ty = cur.tally, done = ty.i >= t.set.values.length;
    $('work').innerHTML = `<div class="tally" role="group" aria-label="Tally rows">${t.cats.map((c, i) => `<button data-k="${i}"${done ? ' aria-disabled="true"' : ''} aria-label="${esc(fmt(c))}: ${ty.marks[i]} ${ty.marks[i] === 1 ? 'mark' : 'marks'}"><span class="name">${rowName(t.set, c)}</span>${tallySvg(ty.marks[i])}</button>`).join('')}</div>`;
    $('work').querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => tallyTap(+b.dataset.k)));
  }
  function tallyTap(k, quiet) {
    const t = cur.task, ty = cur.tally, v = t.set.values;
    if (cur.solved || ty.i >= v.length) return;
    if (t.cats[k] !== v[ty.i]) { say(`That one is ${esc(fmt(v[ty.i]))}. Find its row.`, 'bad'); return; }
    ty.marks[k]++; ty.i++;
    renderData(); renderTally();
    if (!quiet) { const again = $('work').querySelector(`[data-k="${k}"]`); if (again) again.focus(); }
    if (ty.i === v.length) {
      const summary = t.cats.map((c, i) => `${fmt(c)}: ${ty.marks[i]}`).join(', ');
      solved(`Done! Every value is tallied (${esc(summary)}). The marks add up to ${v.length}, the number of values.`, cur.mode === 'lesson' && cur.phase === 'example');
    } else if (!quiet) say(`Next: ${esc(fmt(v[ty.i]))} (value ${ty.i + 1} of ${v.length}).`, 'info');
  }

  // ---------- Frequency table ----------
  function checkTable() {
    const t = cur.task, ins = [...$('work').querySelectorAll('[data-row]')], want = Stats.freq(t.set.values, t.cats);
    const read = s => (/^\s*\d+\s*$/.test(s) ? +s : null);
    const got = ins.map(i => read(i.value)), total = read($('total').value);
    if (got.some(g => g === null) || total === null) { say('Type a whole number in every row and in Total (0 if there are none).', 'info'); return; }
    const off = [], mark = (inp, ok) => { inp.parentElement.className = ok ? 'ok' : 'off'; inp.setAttribute('aria-invalid', ok ? 'false' : 'true'); };
    ins.forEach((inp, i) => { mark(inp, got[i] === want[i]); if (got[i] !== want[i]) off.push(fmt(t.cats[i])); });
    const totalOk = total === t.set.values.length;
    mark($('total'), totalOk);
    if (!off.length && totalOk) { ins.concat($('total')).forEach(i => { i.readOnly = true; }); solved(`Right! The counts add up to the total, ${total}.`); return; }
    cur.tries++;
    const sumOf = got.reduce((s, x) => s + x, 0), n = t.set.values.length;
    if (off.length) say(`Recount the ${off.length === 1 ? 'row' : 'rows'} for ${esc(andList(off))}.${sumOf !== n ? ` (Your counts add up to ${sumOf}, but there are ${n} values.)` : ''}`, 'bad');
    else say(total === sumOf ? 'The total is how many values there are.' : `The total is all the counts added: ${got.join(' + ')}.`, 'bad');
  }

  // ---------- Typed answers ----------
  function checkAnswer() {
    const box = $('answer'), r = cur.task.check(box.value);
    if (r.status === 'right') { box.readOnly = true; solved(r.msg); return; }
    if (r.status !== 'info') cur.tries++;
    say(esc(r.msg), KIND[r.status]);
  }
  function checkNow() {
    if (cur.solved) return;
    const a = cur.task.ask;
    if (a === 'answer') checkAnswer(); else if (a === 'multi') checkMulti(); else if (a === 'table') checkTable(); else if (DRAW.includes(a)) checkDrawing();
  }

  // ---------- Help: hints, and Show Next Step ----------
  function hint() {
    const h = cur.task.hints || [];
    if (!h.length) return;
    say(h[Math.min(cur.hintI, h.length - 1)], 'info');
    cur.hintI++;
  }
  function addStep(html, why) {
    $('steps').hidden = false;
    $('steps').insertAdjacentHTML('beforeend', `<li><span class="work">${html}</span><span class="why">${esc(why)}</span></li>`);
  }
  function step() {
    if (cur.solved) return;
    const t = cur.task;
    if (DRAW.includes(t.ask)) { drawStep(false); return; }
    cur.tries++;                                    // help used: it no longer counts as right on the first try
    if (t.ask === 'answer') {
      const s = t.steps[cur.stepI++];
      addStep(esc(s.html), s.why);
      if (cur.stepI >= t.steps.length) { $('answer').readOnly = true; solved(esc(t.answer), true); }
      else say(`Step ${cur.stepI} of ${t.steps.length}: ${esc(s.html)}. ${esc(s.why)}`, 'info');
    } else if (t.ask === 'choice') {
      const i = t.choices.findIndex(c => c.right), b = $('work').querySelector(`[data-c="${i}"]`);
      b.classList.add('shown');
      $('work').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-disabled', 'true'));
      solved(t.answer || t.choices[i].msg, true);
    } else if (t.ask === 'multi') {
      $('work').querySelectorAll('[data-c]').forEach(b => { const right = t.choices[+b.dataset.c].right; b.setAttribute('aria-pressed', right ? 'true' : 'false'); if (right) b.classList.add('shown'); b.setAttribute('aria-disabled', 'true'); });
      solved(t.msg, true);
    } else if (t.ask === 'tally') {
      // One value at a time for the first five, then the rest the same way.
      const v = t.set.values, go = n => { for (let j = 0; j < n && cur.tally.i < v.length; j++) tallyTap(t.cats.indexOf(v[cur.tally.i]), true); };
      if (cur.stepI++ < 5) { const x = v[cur.tally.i]; go(1); if (!cur.solved) say(`${esc(fmt(x))}: one mark in its row.${cur.stepI === 5 ? ' Show Next Step tallies the rest.' : ''}`, 'info'); }
      else go(v.length);
    } else if (t.ask === 'table') {
      const ins = [...$('work').querySelectorAll('[data-row]')], want = Stats.freq(t.set.values, t.cats), i = cur.stepI++;
      if (i < ins.length) { ins[i].value = want[i]; say(`${esc(fmt(t.cats[i]))} appears ${want[i]} ${want[i] === 1 ? 'time' : 'times'}.`, 'info'); }
      else { $('total').value = t.set.values.length; ins.concat($('total')).forEach(x => { x.readOnly = true; }); solved(`That is the table: the counts add up to the total, ${t.set.values.length}.`, true); }
    }
  }

  // ---------- Finishing a task, and what comes next ----------
  function solved(msg, shown) {
    cur.solved = true; cur.solvedAt = Date.now();
    if (cur.mode === 'check' && !cur.tries && !shown) cur.score++;
    say(msg, shown ? 'info' : 'good');
    $('check').hidden = true; $('hint').hidden = true; $('step').hidden = true; $('quick').hidden = true; $('back').hidden = true;
    let label, label2 = '';
    if (cur.mode === 'lesson') label = cur.phase === 'example' ? 'Your Turn' : cur.ti + 1 < cur.lv.themes.length ? `Next: ${cur.lv.themes[cur.ti + 1].title}` : 'Check Your Understanding';
    else if (cur.mode === 'practice') label = 'Another One';
    else if (cur.mode === 'mist') { label = 'Another Like This'; label2 = 'Next Mistake'; }
    else if (cur.mode === 'lab') { label = cur.labKind === 'quiz' ? 'Another Question' : 'Back to the Lab'; label2 = cur.labKind === 'quiz' ? 'Back to the Lab' : ''; }
    else label = cur.ci + 1 < cur.list.length ? 'Next Question' : 'Finish';
    $('next').textContent = label;
    $('next2').textContent = label2; $('next2').hidden = !label2;
    $('next-row').hidden = false;
    focus($('next'));
  }
  function next() {
    if (Date.now() - cur.solvedAt < 400) return;   // the key that solved it must not also press Next
    if (cur.mode === 'lesson') {
      if (cur.phase === 'example') yourTurn();
      else if (cur.ti + 1 < cur.lv.themes.length) startLevel(cur.lv.n, cur.ti + 1);
      else startCheck(cur.lv.n);
    } else if (cur.mode === 'practice') practiceOne();
    else if (cur.mode === 'mist') startMistakes(cur.g.n, cur.mi);
    else if (cur.mode === 'lab') { if (cur.labKind === 'quiz') labWork('quiz'); else openLab(); }
    else if (cur.ci + 1 < cur.list.length) { cur.ci++; open(cur.list[cur.ci], `Check ${cur.ci + 1} of ${cur.list.length}`); }
    else finished();
  }
  function finished() {
    const n = cur.lv.n, nx = Tasks.level(n + 1), all = cur.list.length, s = cur.score;
    show('done');
    $('done-title').textContent = `Level ${n} Check: ${s} of ${all} Right on the First Try`;
    $('done-body').textContent = s === all ? (nx ? `You’re ready for Level ${nx.n}: ${nx.title}.` : 'You’re ready. Explore more in the Data Lab.') : 'Practice a few more, then try the check again.';
    $('done-next').hidden = !nx;
    $('done-next').textContent = nx ? `Go to Level ${nx.n}` : '';
    focus($('done-title'));
  }

  // ---------- Buttons ----------
  $('menu').addEventListener('click', home);
  $('go-lab').addEventListener('click', openLab);
  // The data on screen always matches the form: changing the data, a setting or the size makes new data at once.
  $('lab-sc').addEventListener('change', e => { lab.key = e.target.value; renderLabOpts(); makeLab(); });
  $('lab-opts').addEventListener('change', makeLab);
  $('lab-n').addEventListener('change', makeLab);
  $('lab-make').addEventListener('click', () => { makeLab(); $('lab-data').querySelector('.data').setAttribute('tabindex', '-1'); focus($('lab-data').querySelector('.data')); });
  $('lab-quiz').addEventListener('click', () => labWork('quiz'));
  $('lab-tally').addEventListener('click', () => labWork('tally'));
  $('lab-build').addEventListener('click', () => labWork('build'));
  $('lab-bar').addEventListener('click', () => labWork('bar'));
  for (const d of ['pie', 'dot', 'hist', 'stem', 'box', 'line', 'curve']) $('lab-' + d).addEventListener('click', () => labWork(d));
  $('quick').addEventListener('click', () => { if (!cur.solved) drawStep(true); });
  $('check').addEventListener('click', checkNow);
  $('hint').addEventListener('click', hint);
  $('step').addEventListener('click', step);
  $('back').addEventListener('click', openLab);
  $('next').addEventListener('click', next);
  $('next2').addEventListener('click', () => { if (Date.now() - cur.solvedAt < 400) return; if (cur.mode === 'mist') nextMistake(); else openLab(); });
  $('go-mist').addEventListener('click', () => startMistakes(1));
  $('done-next').addEventListener('click', () => startLevel(cur.lv.n + 1));
  $('done-again').addEventListener('click', () => startCheck(cur.lv.n));
  $('done-practice').addEventListener('click', () => startPractice(cur.lv.n));
  $('done-menu').addEventListener('click', home);

  // ---------- Starting: the link's #options (or, in the preview, the frame's name) pick the screen ----------
  // No options: the Data Lab. level=N: that level's lesson (start=practice or start=check for those).
  renderHome(); renderLabForm(); renderLearn();
  (function route() {
    const h = new URLSearchParams((location.hash || '').replace(/^#/, '') || (window.name && window.name.includes('=') ? window.name : ''));
    const n = +h.get('level'), st = h.get('start');
    if (st === 'mistakes') startMistakes(n || 1);
    else if (n && Tasks.level(n)) (st === 'practice' ? startPractice(n) : st === 'check' ? startCheck(n) : startLevel(n));
    else if (st === 'menu') home();
    else openLab();
  })();
  booting = false;
})();
</script>
</body>
</html>
